<script>
    const source = new EventSource('localhost:18080/events');

    source.onmessage = function(event) {
        console.log('Dados recebidos:', JSON.parse(event.data));
    };

    source.onerror = function() {
        console.error('Erro na conexão SSE');
        source.close();
    };
</script>
